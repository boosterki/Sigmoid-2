[project]
name = "fleet-or-flow"
version = "1.0.0"
description = "Fleet or Flow? Capacity-planning case study on the Capital Bikeshare 2011-2012 dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "catboost>=1.2.7",
    "mapie>=1.0,<2",
    "altair>=5.4",
    "vl-convert-python>=1.6",
    "astral>=3.2",
    "holidays>=0.58",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
    "litellm>=1.50",
    "gradio>=5.20,<6",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "jupyter>=1.1", "nbformat>=5.10", "nbconvert>=7.16"]

[tool.setuptools]
packages = ["bikeops", "bikeops.desk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
